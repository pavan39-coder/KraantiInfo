services:
  - type: web
    name: kraantiinfo-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start --workspace=@kraantiinfo/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free
      - key: OPENROUTER_FALLBACK_MODELS
        value: google/gemma-4-26b-a4b-it:free
      - key: NEWS_ENGINE_ENABLED
        value: "true"
      - key: NEWS_COLLECTION_INTERVAL_MINUTES
        value: "30"
      - key: AI_AUTO_PROCESSING_ENABLED
        value: "true"
      - key: AI_AUTO_PROCESSING_COOLDOWN_HOURS
        value: "12"
      - key: AI_AUTO_DRAFT_LANGUAGE
        value: hi
      - key: AI_AUTO_PUBLISH_ENABLED
        value: "true"
      - key: NEWSDATA_API_KEY
        sync: false
      - key: BLOGGER_BLOG_ID
        sync: false
      - key: BLOGGER_CLIENT_ID
        sync: false
      - key: BLOGGER_CLIENT_SECRET
        sync: false
      - key: BLOGGER_REFRESH_TOKEN
        sync: false
      - key: BLOGGER_AUTO_PUBLISH_ENABLED
        value: "true"
      - key: PUBLIC_SITE_URL
        value: https://kraantiinfo.vercel.app

